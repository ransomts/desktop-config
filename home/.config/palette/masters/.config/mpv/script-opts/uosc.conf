# Only what differs from uosc's defaults (full list: uosc.conf in the uosc 5.13.0 release).
# Colours follow the desktop: Clemson orange #f56600 on #16161a, text #e6e1dc.
color=foreground=f56600,foreground_text=16161a,background=16161a,background_text=e6e1dc,curtain=16161a,success=7fb069,error=e5484d,match=f56600,heatmap=f56600
opacity=timeline=0.85,menu=0.95,curtain=0.7,title=0.85
border_radius=8
timeline_size=36
# Hyprland draws no title bar and needs no window buttons; keep only the title strip.
top_bar=no-border
top_bar_controls=no
