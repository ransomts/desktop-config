# Hardware decoding where the driver is known good (Intel VA-API here): less CPU, less fan.
hwdec=auto-safe

# uosc draws the controls (scripts/uosc 5.13.0, options in script-opts/uosc.conf),
# so mpv's own controller, seek bar and title bar are off.
osc=no
osd-bar=no
border=no

# Plain on-screen messages and subtitles in the desktop's colours
# (#16161a / #e6e1dc / Clemson orange #f56600, as in ~/.config/quickshell/Theme.qml).
osd-font="FiraCode Nerd Font"
osd-font-size=30
osd-color="#e6e1dc"
osd-border-color="#16161a"
osd-border-size=2
sub-color="#e6e1dc"
sub-border-color="#16161a"
sub-border-size=2.5
sub-shadow-offset=0
