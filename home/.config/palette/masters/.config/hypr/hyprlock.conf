# Dark + Clemson orange
general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    color = rgb(e6e1dc)
    font_family = FiraCode Nerd Font
    font_size = 96
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgb(f56600)
    font_family = FiraCode Nerd Font
    font_size = 20
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 52
    position = 0, -60
    halign = center
    valign = center
    rounding = 12
    outline_thickness = 2
    outer_color = rgb(f56600)
    inner_color = rgba(16161aee)
    font_color = rgb(e6e1dc)
    check_color = rgb(522d80)
    fail_color = rgb(cc3333)
    placeholder_text = <span foreground="##595959">password</span>
    fade_on_empty = false
    dots_center = true
}
