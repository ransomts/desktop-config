# XDG base-directory relocation for tools that default to dumping state in ~.
#
# This file does double duty:
#   - systemd --user reads it (environment.d(5)) so user services and the
#     COSMIC session see these variables after the next login.
#   - ~/.profile sources it with `set -a` so every shell (zsh via ~/.zshenv,
#     bash login shells) sees them immediately.
# Keep it to plain KEY=VALUE lines with ${VAR} references and no shell syntax
# beyond double quotes, so both readers parse it identically.

XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache

# --- language toolchains ---
CARGO_HOME=${XDG_DATA_HOME}/cargo
RUSTUP_HOME=${XDG_DATA_HOME}/rustup
GOPATH=${XDG_DATA_HOME}/go
JULIA_DEPOT_PATH=${XDG_DATA_HOME}/julia:
# juliaup ignores JULIA_DEPOT_PATH; it uses $JULIAUP_DEPOT_PATH/juliaup for its state
JULIAUP_DEPOT_PATH=${XDG_DATA_HOME}/julia
DUB_HOME=${XDG_DATA_HOME}/dub
WORKON_HOME=${XDG_DATA_HOME}/virtualenvs
npm_config_cache=${XDG_CACHE_HOME}/npm
# NVM_DIR is set in ~/.zshrc and ~/.bashrc (nvm is sourced there).

# --- python / data science ---
IPYTHONDIR=${XDG_CONFIG_HOME}/ipython
JUPYTER_CONFIG_DIR=${XDG_CONFIG_HOME}/jupyter
KERAS_HOME=${XDG_STATE_HOME}/keras
KAGGLE_CONFIG_DIR=${XDG_CONFIG_HOME}/kaggle
SCIKIT_LEARN_DATA=${XDG_CACHE_HOME}/scikit_learn_data

# --- R ---
R_PROFILE_USER=${XDG_CONFIG_HOME}/R/profile
R_HISTFILE=${XDG_STATE_HOME}/R/history

# --- misc CLI tools ---
DOCKER_CONFIG=${XDG_CONFIG_HOME}/docker
PARALLEL_HOME=${XDG_CONFIG_HOME}/parallel
INPUTRC=${XDG_CONFIG_HOME}/readline/inputrc
LESSHISTFILE=${XDG_STATE_HOME}/less/history
WGETRC=${XDG_CONFIG_HOME}/wgetrc
MYSQL_HISTFILE=${XDG_STATE_HOME}/mysql/history
# git reads ${XDG_CONFIG_HOME}/git/{config,credentials} natively.

# --- added 2026-09-11, round two ---
ELDEV_DIR=${XDG_DATA_HOME}/eldev
BUNDLE_USER_HOME=${XDG_DATA_HOME}/bundle
TEXMFHOME=${HOME}/Documents/99-misc/texmf
TEXMFVAR=${XDG_CACHE_HOME}/texlive/texmf-var
TEXMFCONFIG=${XDG_CONFIG_HOME}/texlive/texmf-config
MYSQL_HOME=${XDG_CONFIG_HOME}/mysql
PYTHONSTARTUP=${XDG_CONFIG_HOME}/python/pythonrc
# sbcl ignores SBCL_USERINIT (verified 2.5.3); ~/.config/sbcl/sbclrc is passed
# via a shell alias (--userinit) in .zshrc and .bash_aliases instead.
MPLAYER_HOME=${XDG_CONFIG_HOME}/mplayer
W3M_DIR=${XDG_CONFIG_HOME}/w3m
# Values with spaces: double-quote them -- both sh and environment.d strip the
# quotes (verified 2026-09-11 with `systemctl --user show-environment`).
ASPELL_CONF="per-conf ${XDG_CONFIG_HOME}/aspell/aspell.conf; personal ${XDG_CONFIG_HOME}/aspell/en.pws; repl ${XDG_CONFIG_HOME}/aspell/en.prepl"
VIMINIT="source ${XDG_CONFIG_HOME}/vim/vimrc"
