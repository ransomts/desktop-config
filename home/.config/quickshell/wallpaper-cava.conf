# cava feeding the wallpaper's music effect (WallState.qml): 8 bars as text on stdout,
# 20 lines a second. Separate from ~/.config/cava, which is for cava in a terminal.
[general]
framerate = 20
bars = 8
autosens = 1
[input]
method = pulse
source = auto
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
[smoothing]
noise_reduction = 0.6
