# hyprctl dispatch takes a Lua dispatcher under Hyprland 0.57's Lua config; the
# old `hyprctl dispatch dpms on` form errors. hyprland.lua also sets
# misc.key_press_enables_dpms / mouse_move_enables_dpms as a backstop.
general {
    # the Quickshell lock screen; it falls back to hyprlock by itself if it cannot run
    lock_cmd = $HOME/.local/bin/lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
